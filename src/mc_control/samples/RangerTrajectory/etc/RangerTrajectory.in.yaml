# Initial state
init: Ranger::Circle

# Observer pipeline. Encoder must run before BodySensor: BodySensorObserver::run()
# reads realRobot().X_b1_b2(sensor.parentBody(), floatingBaseBody), which depends
# on the joint state Encoder's update() just refreshed through forwardKinematics().
# Same pipeline as rolling-contact-report/config/mc_rtc-ranger-mini-v3-keyboard.yaml.
ObserverPipelines:
- name: RangerTrajectoryPipeline
  gui: false
  observers:
  - type: Encoder
    update: true
    position: encoderValues
    velocity: encoderVelocities
  - type: BodySensor
    update: true
    bodySensor: FloatingBase
    method: sensor
    updatePose: true
    updateVel: true
