      RearLeftSteering:
        duration: 21
        target:
          translation: [-0.247000, 0.182000, 0.125000]
          rotation: *circle_steering_end
        oriWaypoints: *circle_steering
      RearRightSteering:
        duration: 21
        target:
          translation: [-0.247000, -0.182000, 0.125000]
          rotation: *circle_steering_end
