# Run the RangerTrajectory FSM sample on FLAT ground in mc_mujoco: the
# reference run that mc_rtc-ranger-trajectory-ramps-mujoco.yaml is compared
# against.
#
#   cd /home/yuquan/local/mc_rtc_sources/mc_rtc
#   /home/yuquan/local/bin/mc_mujoco -f rolling-contact-report/config/mc_rtc-ranger-trajectory-flat-mujoco.yaml
#
# The only differences from the ramp profile are `MainRobot`, spelled here as
# the plain alias so that mc_mujoco's `ground` lookup falls through to the stock
# flat plane, and the log template. Everything else, including the `robots:`
# block that gives the sample a ground robot at all, is identical, so a
# difference between the two runs is the terrain and nothing else.
MainRobot: RangerMiniV3Robot
Enabled: [RangerTrajectory]
Default: RangerTrajectory
Timestep: 0.005

Log: true
LogPolicy: non-threaded
LogDirectory: /tmp
LogTemplate: mc-rtc-ranger-trajectory-flat-mujoco

ClearControllerModulePath: true
# Two entries, as in the ticker configuration: add_fsm_controller puts the
# shared library under src/, while the controller configuration is configured
# into etc/ one level up. MCGlobalController looks for the library in each
# ControllerModulePaths entry and for <name>.yaml in each entry's etc/
# subdirectory, so both are needed.
ControllerModulePaths:
- build/src/mc_control/samples/RangerTrajectory/src
- build/src/mc_control/samples/RangerTrajectory
ClearRobotModulePath: true
RobotModulePaths: [build/src/mc_robots]
ClearObserverModulePath: true
ObserverModulePaths: [build/src/mc_observers]

GUIServer:
  Enable: true
  # Keep the standard IPC endpoint used by mc_mujoco's built-in visualizer.
  # ControllerServer probes and removes only stale socket files before retrying
  # a bind, while leaving a live controller endpoint untouched.
  IPC:
    Socket: /tmp/mc_rtc
  TCP:
    Host: "127.0.0.1"
    Ports: [4242, 4343]

ClearGlobalPluginPath: true
GlobalPluginPaths: []
Plugins: []

# THE SAMPLE ITSELF LOADS NO GROUND ROBOT
# mc_control::fsm::Controller forwards {rm} to the robot-vector overload of
# MCController (src/mc_control/fsm/Controller.cpp:29), and only the single-robot
# overload appends `env/ground` (MCController.cpp:96). The sample's own
# configuration declares no `robots:` block either, so in any real simulator the
# chassis free-falls: measured without this block, ff_real_tz followed
# 0.16 - 0.5 * 9.81 * t^2 exactly for the whole 78.75 s while the control robot
# happily "tracked" all three curves. MCController reads `robots` from the
# controller configuration (MCController.cpp:242-289), and the controller
# configuration is this whole file overlaid with the sample's etc/ file
# (mc_global_controller_configuration.cpp:329-352, `c.load(default_config)` with
# default_config being the global configuration). The key therefore has to sit
# at the TOP LEVEL here, not under a `RangerTrajectory:` section, and it
# survives because the sample declares no `robots:` of its own.
robots:
  ground:
    module: env/ground
