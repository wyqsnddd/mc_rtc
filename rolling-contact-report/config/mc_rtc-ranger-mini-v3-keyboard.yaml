MainRobot: RangerMiniV3Robot
Enabled: [RollingContact]
Default: RollingContact
Timestep: 0.005
Log: true
LogPolicy: non-threaded
LogDirectory: /tmp
LogTemplate: mc-rtc-ranger-mini-v3-keyboard
ClearControllerModulePath: true
ControllerModulePaths: [build/src/mc_control/samples/RollingContact]
ClearRobotModulePath: true
RobotModulePaths: [build/src/mc_robots]
ClearObserverModulePath: true
ObserverModulePaths: [build/src/mc_observers]
ObserverPipelines:
  - name: RollingContactPipeline
    gui: true
    observers:
      - type: Encoder
        update: true
        position: encoderValues
        velocity: encoderVelocities
      - type: BodySensor
        update: true
        bodySensor: FloatingBase
        method: sensor
        updatePose: true
        updateVel: true
      # Chassis roll and pitch from the IMU and the measured wheel odometry, so
      # that "Rolling Contact" -> "Attitude" in the GUI has something to show
      # while you drive: the estimate, the reference attitude from the
      # FloatingBase pose above, and the angle between them. Nothing in the QP
      # consumes it - `terrainNormal` below is still the configured constant.
      # Yaw is NOT estimated.
      #
      # This configuration runs on flat ground, so the interesting readings are
      # the transients: what the estimate does while the chassis pitches under
      # acceleration, or rolls over whatever it drives into. For a sustained
      # attitude excursion use mc_rtc-ranger-tilt-ticker.yaml under the ticker,
      # or mc_rtc-ranger-ramps-mujoco.yaml for real slopes.
      #
      # Only on the Ranger configurations, not on the shared
      # etc/RollingContact.yaml pipeline: the rolling_diff and rolling_4s
      # variants have no IMU and this observer refuses to configure without one.
      - type: VelocityAidedTilt
        update: true
        updateRobot: false
        imuBodySensor: ChassisIMU
        alpha: 10.0
        beta: 4.0
        gamma: 10.0
        minimumActivation: 1.0
GUIServer:
  Enable: true
  # Keep the standard IPC endpoint used by mc_mujoco's built-in visualizer.
  # ControllerServer probes and removes only stale socket files before retrying
  # a bind, while leaving a live controller endpoint untouched.
  IPC:
    Socket: /tmp/mc_rtc
  TCP:
    Host: "127.0.0.1"
    Ports: [4242, 4343]
ClearGlobalPluginPath: true
GlobalPluginPaths: []
Plugins: []
RollingContact:
  scenario: keyboard
  closedLoopFeedback: true
  keyboardLinearSpeed: 0.3
  keyboardAngularSpeed: 0.5
  keyboardPollIntervalMs: 10
  keyboardExitKey: x
  # 100 rad/s^2 was measured to saturate drive torque and zero the contact
  # normal force against MuJoCo (see mc_rolling_contact_controller.cpp); 20
  # is the pre-rewrite, MuJoCo-validated value.
  driveAcceleration: 20.0
  # The QP's rate rows own both wheel rates. Their weight multiplies dt^2 in
  # the objective, hence the large numbers: 4e7 * (0.005)^2 = 1000, twice the
  # chassis task weights.
  rollingRateWeight: 4.0e7
  steeringRateWeight: 4.0e7
  # Pinned to the controller default so a user configuration cannot move it.
  # Swept against MuJoCo, not against the ticker; see the constructor for the
  # two-sided window this value sits in.
  lateralSlackWeight: 1.0e7
  # The posture task is only a regulariser on the steering hinges now.
  steeringPostureWeight: 1.0
  positionFeedbackGain: 5.0
  velocityGain: 20.0
  postureStiffness: 5.0
  postureWeight: 100.0
  longitudinal: hard
  terrainNormal: [0.0, 0.0, 1.0]
