MainRobot: RollingContactRangerMiniV3
Enabled: [RollingContact]
Default: RollingContact
Timestep: 0.005
Log: true
LogPolicy: non-threaded
LogDirectory: /tmp
LogTemplate: mc-rtc-ranger-mini-v3-keyboard
ClearControllerModulePath: true
ControllerModulePaths: [build/src/mc_control/samples/RollingContact]
ClearRobotModulePath: true
RobotModulePaths: [build/src/mc_robots]
ClearObserverModulePath: true
ObserverModulePaths: [build/src/mc_observers]
ObserverPipelines: []
GUIServer:
  Enable: true
  # Keep the standard IPC endpoint used by mc_mujoco's built-in visualizer.
  # ControllerServer probes and removes only stale socket files before retrying
  # a bind, while leaving a live controller endpoint untouched.
  IPC:
    Socket: /tmp/mc_rtc
  TCP:
    Host: "127.0.0.1"
    Ports: [4242, 4343]
ClearGlobalPluginPath: true
GlobalPluginPaths: []
Plugins: []
RollingContact:
  scenario: keyboard
  closedLoopFeedback: true
  keyboardLinearSpeed: 0.3
  keyboardAngularSpeed: 0.5
  keyboardPollIntervalMs: 10
  keyboardExitKey: x
  driveAcceleration: 100.0
  # The QP's rate rows own both wheel rates. Their weight multiplies dt^2 in
  # the objective, hence the large numbers: 4e7 * (0.005)^2 = 1000, twice the
  # chassis task weights.
  rollingRateWeight: 4.0e7
  steeringRateWeight: 4.0e7
  # The posture task is only a regulariser on the steering hinges now.
  steeringPostureWeight: 1.0
  positionFeedbackGain: 5.0
  velocityGain: 20.0
  postureStiffness: 5.0
  postureWeight: 100.0
  longitudinal: hard
  terrainNormal: [0.0, 0.0, 1.0]
