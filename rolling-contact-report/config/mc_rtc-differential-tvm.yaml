MainRobot: RollingContactDifferential
Enabled: [RollingContact_TVM]
Default: RollingContact_TVM
Timestep: 0.005
Log: true
LogPolicy: non-threaded
LogDirectory: /tmp
LogTemplate: mc-rtc-rolling-differential-tvm
ClearControllerModulePath: true
ControllerModulePaths: [build/src/mc_control/samples/RollingContact]
ClearRobotModulePath: true
RobotModulePaths: [build/src/mc_robots]
ClearObserverModulePath: true
ObserverModulePaths: [build/src/mc_observers]
ObserverPipelines:
  - name: RollingContactPipeline
    gui: true
    observers:
      - type: Encoder
        update: true
        position: encoderValues
        velocity: encoderVelocities
      - type: BodySensor
        update: true
        bodySensor: FloatingBase
        method: sensor
        updatePose: true
        updateVel: true
GUIServer:
  Enable: false
ClearGlobalPluginPath: true
GlobalPluginPaths: []
Plugins: []
RollingContact:
  # Pinned so a user configuration in ~/.config/mc_rtc cannot flip this
  # fixture into closed loop: mc_rtc merges the user file before the -f file,
  # and every key this config leaves unset is inherited from it.
  closedLoopFeedback: false
  scenario: forward
  linearSpeed: 0.2
  yawRate: 0.35
  velocityGain: 20.0
  postureStiffness: 5.0
  postureWeight: 100.0
  longitudinal: hard
  terrainNormal: [0.0, 0.0, 1.0]
